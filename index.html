<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 웹페이지 제목 -->
    <title>wknown의 자기소개</title>

    <style>
        /* 전체 배경색과 글자 정렬 */
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 50px;
        }

        /* 제목 디자인 */
        h1 {
            color: darkblue;
            font-size: 32px;
        }

        /* 자기소개 글 디자인 */
        p {
            color: #333333;
            font-size: 20px;
        }

        /* 좋아하는 것 제목 디자인 */
        h2 {
            color: purple;
            font-size: 26px;
        }

        /* 좋아하는 것 목록 디자인 */
        ul {
            list-style: none;
            padding: 0;
        }

        /* 목록 항목 디자인 */
        li {
            background-color: white;
            margin: 15px auto;
            padding: 15px;
            width: 250px;
            border-radius: 15px;
            font-size: 22px;
        }

        /* 각 항목에 서로 다른 색상 적용 */
        .movie {
            color: #e74c3c;
        }

        .music {
            color: #8e44ad;
        }

        .swim {
            color: #2980b9;
        }
    </style>
</head>

<body>

    <!-- 자기소개 제목 -->
    <h1>🌟 안녕하세요, 저는 wknown예요! 🌟</h1>

    <!-- 자기소개 내용 -->
    <p>저는 코딩을 배우고 있는 중학생입니다.</p>
    <p>새로운 것을 만들고 도전하는 것을 좋아해요! 😊</p>

    <!-- 좋아하는 것 3가지 -->
    <h2>💖 제가 좋아하는 것 3가지 💖</h2>

    <ul>
        <!-- 첫 번째: 영화보기 -->
        <li class="movie">🎬 영화보기</li>

        <!-- 두 번째: 음악듣기 -->
        <li class="music">🎵 음악듣기</li>

        <!-- 세 번째: 수영하기 -->
        <li class="swim">🏊 수영하기</li>
    </ul>

    <!-- 마지막 인사 -->
    <p>✨ 제 웹페이지에 방문해 주셔서 감사합니다! ✨</p>

</body>
</html>
