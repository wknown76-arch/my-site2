<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 웹페이지 제목 설정 -->
    <title>wknown의 자기소개</title>

    <style>
        /* 웹페이지 전체 배경색과 글자 정렬 */
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 50px;
        }

        /* 제목 디자인 */
        h1 {
            color: darkblue;
            font-size: 32px;
        }

        /* 자기소개 글 디자인 */
        p {
            font-size: 20px;
            color: #333333;
        }

        /* 좋아하는 것 목록 디자인 */
        ul {
            list-style-position: inside;
            padding: 0;
            font-size: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <!-- 자기소개 제목 -->
    <h1>안녕하세요, 저는 wknown예요!</h1>

    <!-- 간단한 자기소개 -->
    <p>저는 코딩을 배우고 있는 중학생입니다.</p>
    <p>새로운 것을 만들고 도전하는 것을 좋아해요!</p>

    <!-- 좋아하는 것 3가지 -->
    <h2>제가 좋아하는 것 3가지</h2>

    <ul>
        <li>게임하기</li>
        <li>음악 듣기</li>
        <li>코딩하기</li>
    </ul>

    <!-- 마지막 인사 -->
    <p>제 웹페이지에 방문해 주셔서 감사합니다!</p>

</body>
</html>
